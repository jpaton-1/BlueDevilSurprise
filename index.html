<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <!-- Defeat aggressive mobile-browser caching while iterating -->
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>Duke Chapel AR</title>

  <!-- On-screen error bar (we can't see the phone console) -->
  <div id="err-bar" style="display:none;position:fixed;top:0;left:0;right:0;
    padding:10px 14px;background:#c00;color:#fff;font:13px/1.4 monospace;
    z-index:99999;white-space:pre-wrap;"></div>
  <script>
    function showErr(msg) {
      var b = document.getElementById('err-bar');
      b.textContent = (b.textContent ? b.textContent + '\n' : '') + msg;
      b.style.display = 'block';
    }
    window.onerror = function(msg, src, line) { showErr('JS: ' + msg + ' (line ' + line + ')'); };
    window.addEventListener('unhandledrejection', function(e) { showErr('Promise: ' + e.reason); });
  </script>

  <!-- Exact script set + order from the AR.js official location-based example -->
  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"
          onerror="showErr('FAILED to load aframe.min.js')"></script>
  <!-- ① Defines THREEx.LocationBased + DeviceOrientationControls.
          REQUIRED by gps-new-camera and MUST load before the A-Frame build —
          its absence was the “Can't find variable: THREEx” crash. -->
  <script src="https://cdn.jsdelivr.net/npm/@ar-js-org/ar.js@3.4.8/three.js/build/ar-threex-location-only.js"
          onerror="showErr('FAILED to load ar-threex-location-only.js')"></script>
  <!-- ② FULL A-Frame build — provides BOTH the webcam video system
          (sourceType/arjs-video, which the small location-only build lacked →
          black screen) AND gps-new-camera. Works because ① loads THREEx first. -->
  <script src="https://cdn.jsdelivr.net/npm/@ar-js-org/ar.js@3.4.8/aframe/build/aframe-ar.js"
          onerror="showErr('FAILED to load aframe-ar.js')"></script>

  <!-- Particle burst + slow spin components (registered before the scene parses) -->
  <script>
    // Slow continuous Y spin — writes object3D directly so it never fights
    // gps-new-entity-place (which only sets position).
    AFRAME.registerComponent('slow-spin', {
      schema: { period: { default: 18 } }, // seconds per revolution
      tick: function (t, dt) {
        if (!dt) return;
        this.el.object3D.rotation.y += (Math.PI * 2) / (this.data.period * 1000) * dt;
      }
    });

    // One-shot particle burst at the entity's world position.
    AFRAME.registerComponent('particle-burst', {
      init: function () { this.active = false; this.points = null; this.vel = null; this.t0 = 0; this.LIFE = 2400; },
      trigger: function () {
        if (this.active || this.points) return;
        var N = 300, geo = new THREE.BufferGeometry();
        var pos = new Float32Array(N * 3), col = new Float32Array(N * 3);
        geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
        geo.setAttribute('color',    new THREE.BufferAttribute(col, 3));
        this.vel = new Float32Array(N * 3);
        for (var i = 0; i < N; i++) {
          var th = Math.random() * Math.PI * 2, ph = Math.random() * Math.PI * 0.72, sp = 2.5 + Math.random() * 5.5;
          this.vel[i*3]   = sp * Math.sin(ph) * Math.cos(th);
          this.vel[i*3+1] = sp * Math.cos(ph);
          this.vel[i*3+2] = sp * Math.sin(ph) * Math.sin(th);
          if (Math.random() > 0.4) { col[i*3]=0; col[i*3+1]=48/255; col[i*3+2]=135/255; } // Duke blue
          else { col[i*3]=col[i*3+1]=col[i*3+2]=1; }                                       // white
        }
        var mat = new THREE.PointsMaterial({ size: 0.5, vertexColors: true, transparent: true, opacity: 1, depthWrite: false, sizeAttenuation: true });
        this.points = new THREE.Points(geo, mat);
        this.el.object3D.updateWorldMatrix(true, false);
        var wp = new THREE.Vector3(); this.el.object3D.getWorldPosition(wp);
        this.points.position.copy(wp);
        this.el.sceneEl.object3D.add(this.points);
        this.t0 = performance.now(); this.active = true;
      },
      tick: function () {
        if (!this.active || !this.points) return;
        var t = (performance.now() - this.t0) / 1000, p = t / (this.LIFE / 1000);
        if (p >= 1) { this.el.sceneEl.object3D.remove(this.points); this.points.geometry.dispose(); this.points.material.dispose(); this.points = null; this.active = false; return; }
        var a = this.points.geometry.attributes.position.array, N = a.length / 3;
        for (var i = 0; i < N; i++) { a[i*3]=this.vel[i*3]*t; a[i*3+1]=this.vel[i*3+1]*t - 4.9*t*t; a[i*3+2]=this.vel[i*3+2]*t; }
        this.points.geometry.attributes.position.needsUpdate = true;
        this.points.material.opacity = p > 0.6 ? 1 - (p - 0.6) / 0.4 : 1;
      }
    });
  </script>

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #000; }

    /* Camera video + AR canvas must fill the screen and the canvas must be
       transparent so the camera feed shows through (no blue background). */
    a-scene { position: fixed; inset: 0; }
    .a-canvas { background: transparent !important; }
    video { object-fit: cover; }

    /* iOS tap gate to unlock compass */
    #tap-gate {
      position: fixed; inset: 0; z-index: 9999;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 14px;
      background: rgba(0,0,0,0.76); color: #fff;
      text-align: center; cursor: pointer; -webkit-tap-highlight-color: transparent;
    }
    #tap-gate .icon  { font-size: 54px; }
    #tap-gate .label { font-size: 20px; font-weight: 700; letter-spacing: -0.3px; }
    #tap-gate .sub   { font-size: 13px; opacity: 0.5; }

    /* Navigation overlay */
    #nav {
      position: fixed; inset: 0; z-index: 200; pointer-events: none;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 24px;
      opacity: 0;                 /* hidden until permissions are done + data flows */
      transition: opacity 1s ease;
    }
    #arrow-ring { transition: opacity 0.8s ease; }
    #dist-pill {
      background: rgba(0,0,0,0.52);
      backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px);
      color: #fff; font-size: 18px; font-weight: 600; letter-spacing: -0.2px;
      padding: 11px 28px; border-radius: 40px;
      border: 1px solid rgba(255,255,255,0.14);
      box-shadow: 0 4px 20px rgba(0,0,0,0.4);
      transition: opacity 0.8s ease;
    }
    #waiting {
      position: fixed; bottom: 52px; left: 50%; transform: translateX(-50%);
      background: rgba(0,0,0,0.48);
      backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
      color: rgba(255,255,255,0.62); font-size: 13px;
      padding: 7px 18px; border-radius: 20px;
      z-index: 300; white-space: nowrap; transition: opacity 0.8s;
    }
  </style>
</head>
<body>

  <!-- iOS compass permission gate -->
  <div id="tap-gate" onclick="grantPermission()">
    <div class="icon">📷</div>
    <div class="label">Tap to start AR</div>
    <div class="sub">Enables camera &amp; compass</div>
  </div>

  <!-- Directional nav overlay -->
  <div id="nav">
    <svg id="arrow-ring" width="180" height="180" viewBox="-90 -90 180 180">
      <circle r="84" fill="rgba(0,0,0,0.42)" stroke="rgba(255,255,255,0.11)" stroke-width="1.5"/>
      <line x1="0"   y1="-72" x2="0"   y2="-62" stroke="rgba(255,255,255,0.2)" stroke-width="1.5"/>
      <line x1="0"   y1="72"  x2="0"   y2="62"  stroke="rgba(255,255,255,0.2)" stroke-width="1.5"/>
      <line x1="-72" y1="0"   x2="-62" y2="0"   stroke="rgba(255,255,255,0.2)" stroke-width="1.5"/>
      <line x1="72"  y1="0"   x2="62"  y2="0"   stroke="rgba(255,255,255,0.2)" stroke-width="1.5"/>
      <g id="arrow-inner">
        <polygon points="0,-52 24,-14 12,-14 12,40 -12,40 -12,-14 -24,-14"
                 fill="rgba(255,255,255,0.92)" filter="url(#glow)"/>
        <circle cx="0" cy="40" r="5" fill="rgba(255,255,255,0.32)"/>
      </g>
      <defs>
        <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
          <feGaussianBlur stdDeviation="2.5" result="blur"/>
          <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
        </filter>
      </defs>
    </svg>
    <div id="dist-pill">–– m</div>
  </div>

  <div id="waiting">Waiting for GPS and compass…</div>

  <!-- ── AR Scene — matches the official AR.js location-based example ─────
    Target: steps in front of Duke Chapel  (36.001639, -78.939694)
    scale  4.6          → ~15 ft tall (native model ≈ 1 m). 3.05≈10ft, 6.1≈20ft
    position y -1.6     → ground level (model origin is at the feet)
    NOTE: the `arjs` attribute is added by JS only AFTER the camera is
          granted (see grantPermission), so AR.js never grabs a denied camera. -->
  <a-scene
    vr-mode-ui="enabled: false"
    embedded
    loading-screen="enabled: false"
    renderer="antialias: true; alpha: true">

    <a-assets timeout="30000">
      <a-asset-item id="model" src="blue-devil.glb"></a-asset-item>
    </a-assets>

    <a-camera gps-new-camera="gpsMinDistance: 5"></a-camera>

    <!-- Locked to the Chapel GPS coordinates and visible from a distance so you
         can see it as you walk up. Model origin is at the FEET, so position
         y = -1.6 m (= 1.6 m below eye height) plants the feet on the ground.
         scale 4.6 → ~15 ft tall (native model height ≈ 1 m).
         Resize by changing all three numbers: 3.05 ≈ 10 ft, 6.1 ≈ 20 ft.
         Starts hidden; un-hidden on the first GPS fix so it never renders
         point-blank on the camera before AR.js places it at the Chapel. -->
    <a-entity
      id="blue-devil"
      gltf-model="#model"
      gps-new-entity-place="latitude: 36.001639; longitude: -78.939694"
      position="0 -1.6 0"
      scale="4.6 4.6 4.6"
      visible="false"
      slow-spin
      particle-burst>
    </a-entity>

  </a-scene>

  <script>
    // Report model load success/failure on screen
    document.addEventListener('DOMContentLoaded', function () {
      var e = document.getElementById('blue-devil');
      e.addEventListener('model-loaded', function () { /* loaded ok */ });
      e.addEventListener('model-error', function () { showErr('model-error: blue-devil.glb failed to load'); });
      if (typeof AFRAME !== 'undefined' && !AFRAME.components['gps-new-camera'])
        showErr('gps-new-camera missing — AR.js did not load');

      // Show the devil once AR.js has a GPS fix and has pinned it to the
      // Chapel coordinates — so it appears locked in the world, not on the camera.
      var cam = document.querySelector('a-camera');
      if (cam) cam.addEventListener('gps-camera-update-position', function () {
        document.getElementById('blue-devil').setAttribute('visible', 'true');
      }, { once: true });
    });

    // ── Navigation overlay logic ──────────────────────────────────
    const TARGET    = { lat: 36.001639, lng: -78.939694 };
    const REVEAL_M  = 3.048; // 10 feet — distance at which the Blue Devil appears
    let compassHeading = null, userPos = null, smoothAngle = null, revealed = false;

    // Arrival (within 10 ft): celebratory particle burst + fade the nav away.
    // The devil is already visible and GPS-locked, so we don't rescale it here.
    function triggerReveal() {
      if (revealed) return;
      revealed = true;
      var entity = document.getElementById('blue-devil');
      var pb = entity.components['particle-burst'];
      if (pb) pb.trigger();
      document.getElementById('nav').style.opacity     = '0';
      document.getElementById('waiting').style.opacity = '0';
    }

    // AR.js config — applied to the scene ONLY after the camera is granted.
    const ARJS_CONFIG = 'sourceType: webcam; videoTexture: false; debugUIEnabled: false';

    // One tap fires every permission. NOTE: not async, and the camera is
    // started FIRST and SYNCHRONOUSLY. iOS only honours getUserMedia while the
    // tap's user-activation is still live; any `await` before it consumes that
    // activation and the camera silently never starts ("never initialized").
    function grantPermission() {
      if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
        showErr('Camera API unavailable. The page must be served over HTTPS.');
        return;
      }
      document.getElementById('tap-gate').style.display = 'none';

      // (a) Camera — synchronous, in-gesture. AR.js owns the only camera grab.
      document.querySelector('a-scene').setAttribute('arjs', ARJS_CONFIG);

      // (b) Sensors — GPS watcher + compass listeners.
      boot();

      // (c) iOS compass permission — fired from the same tap (its own promise,
      //     not awaited before the camera, so activation is preserved above).
      if (typeof DeviceOrientationEvent !== 'undefined' &&
          typeof DeviceOrientationEvent.requestPermission === 'function') {
        DeviceOrientationEvent.requestPermission().catch(function () {});
      }
    }

    function boot() {
      window.addEventListener('deviceorientationabsolute', onOrientation, true);
      window.addEventListener('deviceorientation',         onOrientation, true);
      navigator.geolocation.watchPosition(onGPS, function(){}, { enableHighAccuracy: true, maximumAge: 0 });
    }

    function onOrientation(e) {
      let h = null;
      if (e.webkitCompassHeading != null) h = e.webkitCompassHeading;
      else if (e.alpha != null)           h = (360 - e.alpha) % 360;
      if (h === null) return;
      compassHeading = h; tick();
    }
    function onGPS(pos) { userPos = { lat: pos.coords.latitude, lng: pos.coords.longitude }; tick(); }

    function distanceTo(la1, lo1, la2, lo2) {
      const R = 6371000, r = Math.PI/180;
      const dL = (la2-la1)*r, dG = (lo2-lo1)*r;
      const a = Math.sin(dL/2)**2 + Math.cos(la1*r)*Math.cos(la2*r)*Math.sin(dG/2)**2;
      return R*2*Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
    }
    function bearingTo(la1, lo1, la2, lo2) {
      const r = Math.PI/180, dG = (lo2-lo1)*r;
      const y = Math.sin(dG)*Math.cos(la2*r);
      const x = Math.cos(la1*r)*Math.sin(la2*r) - Math.sin(la1*r)*Math.cos(la2*r)*Math.cos(dG);
      return ((Math.atan2(y,x)*180/Math.PI)+360)%360;
    }
    function lerpAngle(a, b, t) { return (a + (((b-a+540)%360)-180)*t + 360)%360; }

    function tick() {
      if (!userPos || compassHeading === null) return;
      if (revealed) return; // nav UI is gone for good once the reveal fires
      const dist  = distanceTo(userPos.lat, userPos.lng, TARGET.lat, TARGET.lng);
      const bear  = bearingTo(userPos.lat, userPos.lng, TARGET.lat, TARGET.lng);
      const angle = (bear - compassHeading + 360) % 360;
      smoothAngle = smoothAngle === null ? angle : lerpAngle(smoothAngle, angle, 0.18);

      // Reveal the compass overlay only now — data is flowing, so every
      // permission prompt is already dismissed and nothing renders behind it.
      document.getElementById('nav').style.opacity        = '1';
      document.getElementById('waiting').style.opacity    = '0';
      document.getElementById('arrow-ring').style.opacity = '1';
      document.getElementById('dist-pill').style.opacity  = '1';
      document.getElementById('arrow-inner').setAttribute('transform', `rotate(${smoothAngle.toFixed(1)})`);

      const feet = dist * 3.28084;
      document.getElementById('dist-pill').textContent = feet < 528
        ? `${Math.round(feet)} ft to Chapel steps`
        : `${(feet/5280).toFixed(2)} mi to Chapel steps`;

      // Within 10 ft → reveal the Blue Devil through a particle burst.
      if (dist <= REVEAL_M) triggerReveal();
    }
    setInterval(tick, 250);
  </script>

</body>
</html>
